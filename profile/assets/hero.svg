<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" role="img" aria-label="PaidMCP: MCP servers that get paid per call">
<defs>
<pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse"><path d="M44 0H0V44" fill="none" stroke="#fff" stroke-opacity=".07"/></pattern>
<radialGradient id="fade" cx=".5" cy="0" r=".85"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
<mask id="gm"><rect width="1000" height="430" fill="url(#fade)"/></mask>
<radialGradient id="spot" cx=".5" cy="0" r=".6"><stop offset="0" stop-color="#C8FF2E" stop-opacity=".22"/><stop offset="1" stop-color="#C8FF2E" stop-opacity="0"/></radialGradient>
<linearGradient id="h1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#9C9C9C"/></linearGradient>
<linearGradient id="edge" x1="0" x2="1"><stop offset="0" stop-color="#000"/><stop offset=".12" stop-color="#fff"/><stop offset=".88" stop-color="#fff"/><stop offset="1" stop-color="#000"/></linearGradient>
<mask id="tm"><rect x="40" y="340" width="920" height="60" fill="url(#edge)"/></mask>
<filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="5"/></filter>
<clipPath id="card"><rect width="1000" height="430" rx="24"/></clipPath>
<style>
.spot{transform-origin:500px 0;animation:br 7s ease-in-out infinite alternate}
@keyframes br{from{transform:scale(.85);opacity:.7}to{transform:scale(1.15);opacity:1}}
.beam{stroke-dasharray:7 93;animation:beam 9s linear infinite}
@keyframes beam{to{stroke-dashoffset:-100}}
.tk{animation:tk 22s linear infinite}
@keyframes tk{to{transform:translateX(-920px)}}
.in{opacity:0;animation:in .9s cubic-bezier(.16,1,.3,1) forwards}
.i2{animation-delay:.12s}.i3{animation-delay:.24s}.i4{animation-delay:.36s}
@keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}@media (prefers-reduced-motion: reduce){.in{opacity:1}}
</style></defs>
<g clip-path="url(#card)">
<rect width="1000" height="430" fill="#050505"/>
<rect width="1000" height="430" fill="url(#grid)" mask="url(#gm)"/>
<rect class="spot" width="1000" height="430" fill="url(#spot)"/>
</g>
<rect x="1" y="1" width="998" height="428" rx="23" fill="none" stroke="#1F1F1F" stroke-width="1.5"/>
<rect class="beam" x="1" y="1" width="998" height="428" rx="23" pathLength="100" fill="none" stroke="#C8FF2E" stroke-width="5" filter="url(#glow)" opacity=".7"/>
<rect class="beam" x="1" y="1" width="998" height="428" rx="23" pathLength="100" fill="none" stroke="#C8FF2E" stroke-width="1.5" stroke-linecap="round"/>

<g class="in">
<svg x="40" y="34" width="26" height="30" viewBox="130 100 280 320">
<g fill="none" stroke="#C8FF2E" stroke-width="46" stroke-linecap="round"><path d="M176 216V378"/><circle cx="270" cy="216" r="94"/></g>
<g fill="#C8FF2E"><rect x="241" y="186" width="18" height="60" rx="9"/><rect x="281" y="186" width="18" height="60" rx="9"/></g>
<circle cx="352" cy="364" r="22" fill="#EDEDED"/></svg>
<text x="76" y="56" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-weight="600" font-size="18" letter-spacing="-.4" fill="#EDEDED">paidmcp</text>
<text x="960" y="55" text-anchor="end" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#8A8A8A">open source · MIT</text>
</g>
<text class="in i2" x="500" y="176" text-anchor="middle" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-weight="700" font-size="66" letter-spacing="-3" fill="url(#h1)">MCP servers that</text>
<text class="in i3" x="500" y="250" text-anchor="middle" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-weight="700" font-size="66" letter-spacing="-3" fill="#C8FF2E">get paid per call.</text>
<text class="in i4" x="500" y="300" text-anchor="middle" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" fill="#8A8A8A">Native MCP + x402. Free on testnet, stablecoins when you go live.</text>
<path d="M40 340H960" stroke="#1F1F1F" stroke-width="1"/>
