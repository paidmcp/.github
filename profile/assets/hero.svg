<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" role="img" aria-label="PaidMCP: open infrastructure for monetizable MCP servers">
<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3DFFA8"/><stop offset="1" stop-color="#22D3EE"/></linearGradient><linearGradient id="gm" gradientUnits="userSpaceOnUse" x1="160" y1="120" x2="370" y2="380"><stop offset="0" stop-color="#3DFFA8"/><stop offset="1" stop-color="#22D3EE"/></linearGradient><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0D1520"/><stop offset="1" stop-color="#070A0F"/></linearGradient>
<pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1.2" cy="1.2" r="1.2" fill="#fff" fill-opacity=".06"/></pattern>
<filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="50"/></filter>
<clipPath id="card"><rect width="1000" height="340" rx="22"/></clipPath>
<style>
.blob1{animation:d1 14s ease-in-out infinite alternate}
.blob2{animation:d2 18s ease-in-out infinite alternate}
@keyframes d1{to{transform:translate(120px,40px)}}
@keyframes d2{to{transform:translate(-140px,-30px)}}
.in{opacity:0;animation:in .8s cubic-bezier(.2,.7,.2,1) forwards}
.i2{animation-delay:.15s}.i3{animation-delay:.3s}.i4{animation-delay:.45s}.i5{animation-delay:.6s}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.cur{animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.wire{stroke-dasharray:4 7;animation:dash 1.2s linear infinite}
@keyframes dash{to{stroke-dashoffset:-22}}
.pk{opacity:0}
.pk1{animation:k1 8s linear infinite}.pk2{animation:k2 8s linear infinite}.pk3{animation:k3 8s linear infinite}.pk4{animation:k4 8s linear infinite}
@keyframes k1{0%{opacity:1;transform:translateX(0)}22%{opacity:1;transform:translateX(110px)}25%,100%{opacity:0;transform:translateX(110px)}}
@keyframes k2{0%,25%{opacity:0;transform:translateX(110px)}25.1%{opacity:1}47%{opacity:1;transform:translateX(0)}50%,100%{opacity:0;transform:translateX(0)}}
@keyframes k3{0%,50%{opacity:0;transform:translateX(0)}50.1%{opacity:1}72%{opacity:1;transform:translateX(110px)}75%,100%{opacity:0;transform:translateX(110px)}}
@keyframes k4{0%,75%{opacity:0;transform:translateX(110px)}75.1%{opacity:1}97%{opacity:1;transform:translateX(0)}100%{opacity:0;transform:translateX(0)}}
.pl{opacity:0;animation:pl 8s linear infinite}
.pl2{animation-delay:2s}.pl3{animation-delay:4s}.pl4{animation-delay:6s}
@keyframes pl{0%{opacity:0;transform:translateY(6px)}3%,22%{opacity:1;transform:none}25%,100%{opacity:0;transform:translateY(-6px)}}
.nb{animation:nb 4s ease-in-out infinite}
@keyframes nb{50%{stroke-opacity:1}}
.orb{transform-origin:797px 150px;animation:spin 40s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
@media (prefers-reduced-motion: reduce){.in,.pl1{opacity:1}}
</style></defs>
<g clip-path="url(#card)">
<rect width="1000" height="340" fill="url(#bg)"/>
<circle class="blob1" cx="140" cy="20" r="150" fill="#3DFFA8" fill-opacity=".16" filter="url(#blur)"/>
<circle class="blob2" cx="900" cy="330" r="170" fill="#22D3EE" fill-opacity=".15" filter="url(#blur)"/>
<rect width="1000" height="340" fill="url(#dots)"/>
</g>
<rect x=".75" y=".75" width="998.5" height="338.5" rx="22" fill="none" stroke="#1E2A3A" stroke-width="1.5"/>

<g class="in"><svg x="52" y="52" width="76" height="87" viewBox="130 100 280 320">
<g fill="none" stroke="url(#gm)" stroke-width="46" stroke-linecap="round">
  <path d="M176 216V378"/>
  <circle cx="270" cy="216" r="94"/>
</g>
<g fill="url(#gm)">
  <rect x="241" y="186" width="18" height="60" rx="9"/>
  <rect x="281" y="186" width="18" height="60" rx="9"/>
</g><circle cx="352" cy="364" r="22" fill="#FFB547"/></svg>
<text x="142" y="118" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-weight="800" font-size="60" letter-spacing="-1.5" fill="#F2F6FA">Paid<tspan fill="url(#g)">MCP</tspan></text></g>
<text class="in i2" x="56" y="186" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-weight="600" font-size="21" fill="#F2F6FA">Open infrastructure for monetizable MCP servers.</text>
<text class="in i3" x="56" y="222" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14.5" fill="#8FA1B5"><tspan fill="#3DFFA8">$</tspan> agents connect, pay per call, settle in stablecoins<tspan class="cur" fill="#3DFFA8"> ▍</tspan></text>
<g class="in i4"><g transform="translate(56 262)"><rect width="97" height="28" rx="14" fill="#3DFFA8" fill-opacity=".08" stroke="#3DFFA8" stroke-opacity=".45"/><text x="48.5" y="18.5" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#3DFFA8">native MCP</text></g><g transform="translate(163 262)"><rect width="53.2" height="28" rx="14" fill="#FFB547" fill-opacity=".08" stroke="#FFB547" stroke-opacity=".45"/><text x="26.6" y="18.5" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#FFB547">x402</text></g><g transform="translate(226.2 262)"><rect width="111.6" height="28" rx="14" fill="#22D3EE" fill-opacity=".08" stroke="#22D3EE" stroke-opacity=".45"/><text x="55.8" y="18.5" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#22D3EE">pay-per-call</text></g><g transform="translate(347.79999999999995 262)"><rect width="118.89999999999999" height="28" rx="14" fill="#3DFFA8" fill-opacity=".08" stroke="#3DFFA8" stroke-opacity=".45"/><text x="59.449999999999996" y="18.5" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#3DFFA8">testnet first</text></g></g>

<g class="in i5">
<circle class="orb" cx="797" cy="150" r="128" fill="none" stroke="#1E2A3A" stroke-dasharray="2 10" stroke-width="1.5"/>
<path class="wire" d="M742 150H852" stroke="#55667A" stroke-width="2" fill="none"/>
<g transform="translate(630 112)"><rect width="112" height="76" rx="14" fill="#070A0F" stroke="#1E2A3A" stroke-width="1.5"/><rect width="112" height="76" rx="14" fill="none" stroke="url(#g)" stroke-opacity=".5" class="nb"/><text x="56" y="34" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-weight="700" font-size="15" fill="#F2F6FA">AI agent</text><text x="56" y="54" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" fill="#8FA1B5">MCP client</text></g>
<g transform="translate(852 112)"><rect width="112" height="76" rx="14" fill="#070A0F" stroke="#1E2A3A" stroke-width="1.5"/><rect width="112" height="76" rx="14" fill="none" stroke="url(#g)" stroke-opacity=".5" class="nb"/><text x="56" y="34" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-weight="700" font-size="15" fill="#F2F6FA">MCP server</text><text x="56" y="54" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" fill="#8FA1B5">/mcp + x402</text></g>
<g transform="translate(742 150)">
<circle class="pk pk1" r="6" fill="#F2F6FA"/><circle class="pk pk2" r="6" fill="#FFB547"/><circle class="pk pk3" r="6" fill="#3DFFA8"/><circle class="pk pk4" r="6" fill="#22D3EE"/>
</g>
<g transform="translate(797 234)">
<g class="pl pl1"><rect x="-105" y="-15" width="210" height="30" rx="15" fill="#070A0F" stroke="#F2F6FA" stroke-opacity=".6"/><circle cx="-86" cy="0" r="4" fill="#F2F6FA"/><text x="8" y="4.5" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12.5" fill="#F2F6FA">tools/call</text></g><g class="pl pl2"><rect x="-105" y="-15" width="210" height="30" rx="15" fill="#070A0F" stroke="#FFB547" stroke-opacity=".6"/><circle cx="-86" cy="0" r="4" fill="#FFB547"/><text x="8" y="4.5" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12.5" fill="#FFB547">402 Payment Required</text></g><g class="pl pl3"><rect x="-105" y="-15" width="210" height="30" rx="15" fill="#070A0F" stroke="#3DFFA8" stroke-opacity=".6"/><circle cx="-86" cy="0" r="4" fill="#3DFFA8"/><text x="8" y="4.5" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12.5" fill="#3DFFA8">x402 payment</text></g><g class="pl pl4"><rect x="-105" y="-15" width="210" height="30" rx="15" fill="#070A0F" stroke="#22D3EE" stroke-opacity=".6"/><circle cx="-86" cy="0" r="4" fill="#22D3EE"/><text x="8" y="4.5" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12.5" fill="#22D3EE">200 OK + result</text></g>
</g>
</g>
</svg>
